- Home & Media:
    - Home Assistant:
        icon: home-assistant.png
        href: http://10.0.0.5:8123
        siteMonitor: http://10.0.0.5:8123
        widget:
          type: homeassistant
          url: http://10.0.0.5:8123
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
          custom:
            - template: "{{ states.person | selectattr('state','equalto','home') | list | length }}"
              label: home
            - template: "{{ states.light | selectattr('state','equalto','on') | list | length }}"
              label: lights on
            - template: "{{ states.update | selectattr('state','equalto','on') | list | length }}"
              label: updates
