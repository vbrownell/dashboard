# Converted from Dashy (nigel:4000) on 2026-11-13.
# siteMonitor = HTTP check from inside the container; ping = ICMP.
# .local (mDNS) names can't be resolved from the container, so they have no monitor.

- Infrastructure:
    - Proxmox:
        icon: proxmox.png
        href: https://10.0.0.4:8006
        description: pve
        siteMonitor: https://10.0.0.4:8006
        widget:
          type: proxmox
          url: https://10.0.0.4:8006
          username: "{{HOMEPAGE_VAR_PVE_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PVE_TOKEN_SECRET}}"
          node: pve
    - Proxmox Monitor:
        icon: proxmox.png
        href: http://10.0.0.4:8008/
        siteMonitor: http://10.0.0.4:8008/
